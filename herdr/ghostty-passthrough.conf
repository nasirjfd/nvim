# Free these cmd-chords so Ghostty passes them to herdr instead of handling them itself.
keybind = super+d=unbind
keybind = super+shift+d=unbind
keybind = super+alt+h=unbind
keybind = super+alt+j=unbind
keybind = super+alt+k=unbind
keybind = super+alt+l=unbind
keybind = super+ctrl+shift+h=unbind
keybind = super+ctrl+shift+j=unbind
keybind = super+ctrl+shift+k=unbind
keybind = super+ctrl+shift+l=unbind
keybind = super+shift+enter=unbind
