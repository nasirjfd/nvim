# Cmd+D goes to the pane application (duplicate in Neovim), never to a split action.
keybind = super+d=csi:100;9u
# Free these cmd-chords so Ghostty passes them through instead of handling them itself.
keybind = super+shift+d=unbind
# cmd+alt+hjkl (herdr focus_pane_*) are sent as exact CSI-u bytes (11 = super+alt): left to Ghostty's
# key encoder, a quick cmd+alt+l right after cmd+alt+h reached the pane as a plain "l".
keybind = super+alt+h=csi:104;11u
keybind = super+alt+j=csi:106;11u
keybind = super+alt+k=csi:107;11u
keybind = super+alt+l=csi:108;11u
keybind = super+ctrl+shift+h=unbind
keybind = super+ctrl+shift+j=unbind
keybind = super+ctrl+shift+k=unbind
keybind = super+ctrl+shift+l=unbind
keybind = super+shift+enter=unbind
# Preserve modifiers for Neovim: do not turn Cmd+I into Tab or Ctrl+Enter into Enter.
keybind = super+i=csi:105;9u
keybind = super+period=csi:46;9u
keybind = ctrl+enter=csi:13;5u
